# =============================================================================
# Nginx 配置 — 双 Server 架构
# =============================================================================
# 背景：阿里云 CDN 静态加速仅转发 GET/HEAD 请求，不支持 PUT/POST。
#       站点设置保存使用 PUT 批量写入，必须绕过 CDN 直连源服务器。
#       但浏览器不允许 HTTPS 页面（CDN）向 HTTP 地址发请求（混合内容拦截），
#       因此需要源服务器也提供 HTTPS 端点，使用正式 SSL 证书。
#
# 架构：
#   【普通访客】https://hknihong.xyz → CDN → Nginx:80 → Backend:3000  (GET 全部通过)
#   【管理员存盘】页面 JS → PUT → https://124.220.74.229:8443 → Nginx:443 → Backend:3000
#
# 注意：
#   - 8443 是主机端口，映射到容器的 443（docker-compose.yml 中定义）
#   - hknihong.xyz DNS 指向 CDN，不能用域名访问 8443，必须用服务器 IP
#   - 证书 /etc/nginx/ssl/ 是卷挂载，来自宿主机 /etc/ssl/cert/
#   - 8443 端口需要在阿里云安全组放行（入方向 TCP）
# =============================================================================

# =============================================================================
# Server 1：HTTP (80) — CDN 回源与普通 HTTP 访问
# 处理从 CDN 回源的请求，以及通过服务器 IP 直接访问的请求
# =============================================================================
server {
    listen 80;                   # 监听 IPv4 80 端口
    server_name _;               # _ 是占位符，表示接受任意域名/IP 的请求

    root /usr/share/nginx/html;  # 静态文件根目录（前端构建产物）
    index index.html;            # 默认首页文件

    # ---- 安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;             # 禁止被其他站点通过 <iframe> 嵌入，防止点击劫持
    add_header X-Content-Type-Options "nosniff" always;         # 禁止浏览器 MIME 类型嗅探，防止脚本注入
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # 跨域时只发送域名（不含路径），同源发送完整 Referrer

    # ---- Gzip 压缩 ----
    gzip on;                     # 开启 Gzip 压缩，减少传输体积
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;  # 需要压缩的 MIME 类型
    gzip_min_length 1024;        # 小于 1KB 不压缩（压缩小文件得不偿失）
    gzip_vary on;                # 响应头添加 Vary: Accept-Encoding，让 CDN/代理缓存区分压缩版本

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 30d;             # 浏览器缓存 30 天（Vue 构建产物文件名含 hash，内容变了文件名就变）
        add_header Cache-Control "public";  # 允许 CDN 和浏览器缓存此路径
    }

    # ---- index.html 缓存策略 ----
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";  # 禁止缓存（每次请求都验证是否有新版本，确保前端更新后立即生效）
    }

    # ---- API 反向代理 ----
    # 将 /api/ 开头的请求转发到 Node.js 后端容器（内部 DNS：blog-backend）
    # 此路径的 GET 请求经 CDN 回源到达这里，但 CDN 不转发 PUT/POST
    location /api/ {
        proxy_pass http://blog-backend:3000;   # 后端容器地址（Docker 内部 DNS）
        proxy_set_header Host $host;           # 透传原始 Host 头
        proxy_set_header X-Real-IP $remote_addr;  # 透传客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 透传代理链路上所有 IP
        proxy_set_header X-Forwarded-Proto $scheme;  # 透传原始协议（http 或 https）
        proxy_connect_timeout 60s;  # 连接后端超时 60 秒
        proxy_read_timeout 120s;    # 读取后端响应超时 120 秒（AI 对话等长时间请求需要）
    }

    # ---- 上传文件代理 ----
    location /uploads/ {
        proxy_pass http://blog-backend:3000;   # 转发到后端容器
        proxy_set_header Host $host;           # 透传 Host 头
    }

    # ---- SPA 路由回退 ----
    # Vue Router 使用 HTML5 History 模式，URL 如 /admin/settings 在服务器上不存在
    # try_files 先尝试匹配物理文件，找不到则返回 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# Server 2：HTTPS (443) — 管理后台直连，绕过 CDN，支持 PUT/POST
# =============================================================================
# 主机 8443 端口（docker-compose 映射） → 容器 443 端口 → 此 server block
# 使用正式 CA 证书（hknihong.xyz），浏览器信任证书链
# 但 SNI 名称（124.220.74.229）与证书 CN（hknihong.xyz）不匹配 → 浏览器首次访问需手动接受证书警告
server {
    listen 443 ssl;              # 监听 IPv4 443 端口并启用 SSL/TLS
    server_name _;               # 占位符，接受任意 SNI 名称（IP 直连时用）

    # ---- SSL 证书配置 ----
    ssl_certificate /etc/nginx/ssl/hknihong.xyz.pem;     # 证书文件（容器内路径，卷挂载）
    ssl_certificate_key /etc/nginx/ssl/hknihong.xyz.key; # 私钥文件（容器内路径，卷挂载）
    ssl_protocols TLSv1.2 TLSv1.3;                       # 仅允许 TLS 1.2 和 1.3（禁用不安全的旧版本）
    ssl_ciphers HIGH:!aNULL:!MD5;                         # 使用高强度加密套件，禁用空加密和 MD5

    root /usr/share/nginx/html;  # 静态文件根目录
    index index.html;            # 默认首页文件

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- API 反向代理（含 CORS 跨域处理） ----
    # 跨端口请求（hknihong.xyz:443 → 124.220.74.229:8443）属跨域，浏览器先发 OPTIONS 预检。
    # 后端 Express CORS 中间件会返回 CORS 响应头，但可能因配置返回重复的
    # Access-Control-Allow-Origin 值（如同时返回具体域名和 *），浏览器看到两个不同值会拒绝。
    # 解决：proxy_hide_header 过滤掉后端返回的重复头，在 nginx 层统一设置。
    location /api/ {
        proxy_hide_header 'Access-Control-Allow-Origin';                   # 移除后端返回的 CORS 域名头（避免重复）
        add_header 'Access-Control-Allow-Origin' 'https://hknihong.xyz' always;    # 仅允许管理页面所在域跨域访问
        add_header 'Access-Control-Allow-Credentials' 'true' always;       # 允许跨域请求携带 Cookie / Authorization 头

        proxy_pass http://blog-backend:3000;   # 代理到后端容器
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # 上游协议固定为 https（因为此 server 走 HTTPS）
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://blog-backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
