# =============================================================================
# Nginx 配置 — 双 Server 架构
# =============================================================================
# 背景：阿里云 CDN 静态加速仅转发 GET/HEAD 请求，不支持 PUT/POST。
#       站点设置保存使用 PUT 批量写入，必须绕过 CDN 直连源服务器。
#       但浏览器不允许 HTTPS 页面（CDN）向 HTTP 地址发请求（混合内容拦截），
#       因此需要源服务器也提供 HTTPS 端点，使用正式 SSL 证书。
#
# 架构：
#   【普通访客】https://hknihong.xyz → CDN → Nginx:80 → Backend:3000  (GET 全部通过)
#   【管理员存盘】页面 JS → PUT → https://124.220.74.229:8443 → Nginx:443 → Backend:3000
#
# 注意：
#   - 8443 是主机端口，映射到容器的 443（docker-compose.yml 中定义）
#   - hknihong.xyz DNS 指向 CDN，不能用域名访问 8443，必须用服务器 IP
#   - 证书 /etc/nginx/ssl/ 是卷挂载，来自宿主机 /etc/ssl/cert/
#   - 8443 端口需要在阿里云安全组放行（入方向 TCP）
# =============================================================================

# =============================================================================
# Server 1：HTTP (80) — CDN 回源与普通 HTTP 访问
# =============================================================================
server {
    listen 80;
    server_name _;  # 接受任意域名和 IP 访问

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩，减少传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # 静态资源（JS/CSS 带 hash）：长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html：禁止缓存，确保更新后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API 反向代理 → Node.js 后端（容器内通信）
    # 此路径的 GET 请求经 CDN 回源到达这里，CDN 不转发 PUT/POST
    location /api/ {
        proxy_pass http://blog-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://blog-backend:3000;
        proxy_set_header Host $host;
    }

    # SPA 路由回退：所有非静态资源路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# Server 2：HTTPS (443) — 管理后台直连，绕过 CDN，支持 PUT/POST
# =============================================================================
# 主机 8443 端口 → 容器 443 端口 → 此 server block
# 使用正式 CA 证书（hknihong.xyz），浏览器信任证书链
# 但 SNI 名称（124.220.74.229）与证书 CN（hknihong.xyz）不匹配 → 首次访问需手动接受
server {
    listen 443 ssl;
    server_name _;  # IP 直连，接受任意 SNI

    # SSL 证书：卷挂载自宿主 /etc/ssl/cert/
    ssl_certificate /etc/nginx/ssl/hknihong.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/hknihong.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API 反向代理（含 CORS 处理）
    # 问题：跨端口（hknihong.xyz:443 → 124.220.74.229:8443）触发浏览器 CORS 预检。
    #       OPTIONS 请求先到达这里，代理到后端 Express，后端 CORS 中间件返回 CORS 头。
    #       但后端可能返回重复的 Access-Control-Allow-Origin（具体域名 + *），
    #       浏览器看到两个不同值会拒绝整个请求。
    # 解决：proxy_hide_header 去掉后端返回的 CORS-Origin 头，
    #       然后在 nginx 层面统一设置为 hknihong.xyz（管理页唯一来源）。
    location /api/ {
        # 去掉后端可能返回的重复 Access-Control-Allow-Origin 头
        proxy_hide_header 'Access-Control-Allow-Origin';
        # 统一设置正确的 CORS 头：仅允许管理页面所在域跨域
        add_header 'Access-Control-Allow-Origin' 'https://hknihong.xyz' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://blog-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://blog-backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
